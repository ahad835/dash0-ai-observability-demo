receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
exporters:
  otlphttp/dash0:
    endpoint: ${env:DASH0_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:DASH0_AUTH_TOKEN}"
      Dash0-Dataset: ${env:DASH0_DATASET}
  debug:
    verbosity: basic
service:
  pipelines:
    traces:  { receivers: [otlp], processors: [batch], exporters: [otlphttp/dash0, debug] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [otlphttp/dash0, debug] }
    logs:    { receivers: [otlp], processors: [batch], exporters: [otlphttp/dash0, debug] }
